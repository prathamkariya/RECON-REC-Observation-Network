# Full RECON stack: Postgres + backend API + dashboard.
#
#   cp .env.docker.example .env      # optional — every value has a default
#   docker compose up --build
#
#   Dashboard  http://localhost:3000
#   API + docs http://localhost:8000/docs
#
# The stack runs with no configuration at all: every USE_REAL_* source defaults
# to its mock, so nothing here needs an API key, a wallet, or a chain. Fill in
# .env as those arrive and `docker compose up -d --build` to pick them up.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recon_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-recon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host by default — only the backend needs to reach
    # it, and binding a database to 0.0.0.0 with a known dev password is how
    # test instances end up on the public internet. Uncomment to use psql.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recon} -d ${POSTGRES_DB:-recon}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-recon}:${POSTGRES_PASSWORD:-recon_dev_password}@db:5432/${POSTGRES_DB:-recon}

      # Every real source is off by default, so the stack boots with no
      # credentials. Flip one on once its dependency is configured below.
      USE_REAL_ML: ${USE_REAL_ML:-false}
      USE_REAL_GRAPH: ${USE_REAL_GRAPH:-false}
      USE_REAL_WEATHER: ${USE_REAL_WEATHER:-false}
      USE_REAL_EXPLAIN: ${USE_REAL_EXPLAIN:-false}
      USE_REAL_LEDGER: ${USE_REAL_LEDGER:-false}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      WEATHER_TIMEOUT_SECONDS: ${WEATHER_TIMEOUT_SECONDS:-3.0}
      EXPLAIN_TIMEOUT_SECONDS: ${EXPLAIN_TIMEOUT_SECONDS:-5.0}

      # Browser origins allowed to call the API. The dashboard's own origin is
      # the host-side one, because the request comes from the user's browser.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      # On-chain registry. Unset means the /certificates routes report a
      # configuration error; every other route works without them.
      RPC_URL: ${RPC_URL:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      BACKEND_PRIVATE_KEY: ${BACKEND_PRIVATE_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  dashboard:
    build:
      context: ./dashboard
      args:
        # Baked into the client bundle at build time — a browser-reachable
        # address, not the `backend` service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCK_DATA: ${NEXT_PUBLIC_USE_MOCK_DATA:-true}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_SEPOLIA_RPC_URL:-https://rpc.sepolia.org}
        NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

volumes:
  postgres_data:

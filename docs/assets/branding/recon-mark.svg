<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Observation Reticle -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2,6"/>
  
  <!-- Reticle Cardinal Crosshairs -->
  <line x1="60" y1="2" x2="60" y2="10" stroke="#38bdf8" stroke-width="2"/>
  <line x1="60" y1="110" x2="60" y2="118" stroke="#38bdf8" stroke-width="2"/>
  <line x1="2" y1="60" x2="10" y2="60" stroke="#38bdf8" stroke-width="2"/>
  <line x1="110" y1="60" x2="118" y2="60" stroke="#38bdf8" stroke-width="2"/>

  <!-- Radar Scanning Arc (Subtle) -->
  <path d="M 60 12 A 48 48 0 0 1 108 60" fill="none" stroke="url(#markGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="108" cy="60" r="3" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Core Hex Shield Ground -->
  <polygon points="60,24 88,38 88,72 60,94 32,72 32,38" fill="url(#shieldGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Stylized Geometric "R" + Energy Pulse Topology -->
  <!-- Vertical stem -->
  <path d="M 46 38 L 46 80" stroke="url(#markGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Top loop of R -->
  <path d="M 46 40 L 64 40 C 74 40, 75 56, 64 56 L 46 56" fill="none" stroke="url(#markGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Diagonal leg of R terminating in Network Node -->
  <path d="M 60 56 L 73 78" stroke="url(#markGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="74" cy="79" r="4" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Center Energy Core Beacon -->
  <circle cx="60" cy="48" r="3" fill="#ffffff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.7"/>
    </pattern>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Frame Ground -->
  <rect width="860" height="170" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="860" height="170" rx="16" fill="url(#dotGrid)"/>

  <!-- Left: The Mark -->
  <g transform="translate(36, 25)">
    <!-- Observation Radar Reticle -->
    <circle cx="60" cy="60" r="56" fill="#0b1324" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2,6"/>
    
    <!-- Crosshairs -->
    <line x1="60" y1="2" x2="60" y2="10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="110" x2="60" y2="118" stroke="#38bdf8" stroke-width="2"/>
    <line x1="2" y1="60" x2="10" y2="60" stroke="#38bdf8" stroke-width="2"/>
    <line x1="110" y1="60" x2="118" y2="60" stroke="#38bdf8" stroke-width="2"/>

    <!-- Radar Sweep Glow -->
    <path d="M 60 14 A 46 46 0 0 1 106 60" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="106" cy="60" r="3.5" fill="#38bdf8" filter="url(#markGlow)"/>

    <!-- Geometric Hex Shield Ground -->
    <polygon points="60,24 88,38 88,72 60,94 32,72 32,38" fill="#0d1829" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Geometric "R" Motif -->
    <path d="M 46 38 L 46 80" stroke="url(#brandGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 46 40 L 64 40 C 74 40, 75 56, 64 56 L 46 56" fill="none" stroke="url(#brandGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 56 L 73 78" stroke="url(#brandGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="74" cy="79" r="3.5" fill="#38bdf8"/>
    <circle cx="60" cy="48" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Middle: Logotype & Hierarchy -->
  <g transform="translate(182, 32)">
    <!-- Top System Label -->
    <text x="0" y="16" fill="#10b981" font-size="11" font-weight="700" class="mono" letter-spacing="2.5">GRID FORENSICS · OBSERVATION NETWORK</text>
    
    <!-- Wordmark -->
    <text x="0" y="66" fill="url(#titleGrad)" font-size="52" font-weight="900" class="sans" letter-spacing="4">RECON</text>
    
    <!-- Subtitle Lockup -->
    <text x="3" y="90" fill="#38bdf8" font-size="13" font-weight="700" class="mono" letter-spacing="3.5">REC OBSERVATION NETWORK</text>
    
    <!-- Tagline -->
    <text x="3" y="112" fill="#94a3b8" font-size="12" font-weight="500" class="sans" letter-spacing="0.2">AI Fraud Intelligence &amp; Cryptographic Verification for Clean Energy Markets</text>
  </g>

  <!-- Right: Telemetry & State Box -->
  <g transform="translate(680, 32)">
    <rect width="144" height="106" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    
    <circle cx="16" cy="20" r="4" fill="#10b981"/>
    <text x="26" y="24" fill="#10b981" font-size="10" font-weight="700" class="mono">SYSTEM LIVE</text>
    
    <line x1="12" y1="36" x2="132" y2="36" stroke="#1e293b" stroke-width="1"/>
    
    <text x="14" y="52" fill="#64748b" font-size="9" class="mono">CHAIN ID</text>
    <text x="14" y="66" fill="#f8fafc" font-size="11" font-weight="700" class="mono">11155111</text>
    
    <text x="14" y="84" fill="#64748b" font-size="9" class="mono">REGISTRY</text>
    <text x="14" y="98" fill="#38bdf8" font-size="11" font-weight="700" class="mono">ERC-721 · EVM</text>
  </g>

  <!-- Bottom Accent Laser Line -->
  <line x1="30" y1="168" x2="830" y2="168" stroke="url(#glowLine)" stroke-width="2"/>
</svg>

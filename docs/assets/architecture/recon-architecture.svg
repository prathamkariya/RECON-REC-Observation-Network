<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="feBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="beBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="engBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142642"/>
      <stop offset="100%" stop-color="#0c182c"/>
    </linearGradient>
    <linearGradient id="fusBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <marker id="aDown" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,7 z" fill="#38bdf8"/>
    </marker>
    <marker id="aRight" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L7,4 z" fill="#38bdf8"/>
    </marker>
    <marker id="aEmerald" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,7 z" fill="#10b981"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="960" height="520" rx="16" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="1" y="1" width="958" height="42" rx="15" fill="#0f172a" fill-opacity="0.85"/>
  <circle cx="28" cy="22" r="5" fill="#38bdf8"/>
  <text x="44" y="26" fill="#f8fafc" font-size="12" font-weight="700" class="sans" letter-spacing="0.5">RECON SYSTEM ARCHITECTURE &amp; SUBSYSTEM TOPOLOGY</text>
  <text x="920" y="26" fill="#94a3b8" font-size="11" class="mono" text-anchor="end">PRODUCTION TOPOLOGY</text>

  <!-- Level 1: Frontend Presentation Tier -->
  <g transform="translate(40, 60)">
    <rect width="880" height="66" rx="10" fill="url(#feBox)" stroke="#334155" stroke-width="1.2"/>
    <rect x="14" y="12" width="130" height="20" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="79" y="26" fill="#38bdf8" font-size="10" font-weight="700" class="mono" text-anchor="middle">FRONTEND TIER</text>
    <text x="14" y="52" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Next.js 16 (App Router) · React 19 · Tailwind CSS v4 · shadcn/ui · viem / wagmi</text>
    <text x="860" y="50" fill="#94a3b8" font-size="11" class="mono" text-anchor="end">Port :3000</text>
  </g>

  <!-- Arrow down to Backend -->
  <line x1="480" y1="126" x2="480" y2="148" stroke="#38bdf8" stroke-width="2" marker-end="url(#aDown)"/>

  <!-- Level 2: Backend Orchestration API -->
  <g transform="translate(40, 150)">
    <rect width="880" height="68" rx="10" fill="url(#beBox)" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="14" y="12" width="110" height="20" rx="4" fill="#60a5fa" fill-opacity="0.2"/>
    <text x="69" y="26" fill="#93c5fd" font-size="10" font-weight="700" class="mono" text-anchor="middle">API GATEWAY</text>
    <text x="135" y="27" fill="#cbd5e1" font-size="12" class="sans">FastAPI REST Orchestrator · Pydantic v2 · SQLAlchemy ORM · web3.py Client</text>
    <text x="860" y="26" fill="#60a5fa" font-size="11" class="mono" text-anchor="end">Port :8000</text>
    <text x="14" y="54" fill="#e2e8f0" font-size="12" class="sans">Pipelines: <tspan class="mono" fill="#38bdf8">POST /certificates/analyze</tspan> (Scoring) · <tspan class="mono" fill="#34d399">POST /certificates/issue</tspan> (Mint) · <tspan class="mono" fill="#fbbf24">GET /certificates/{id}</tspan> (Dossier)</text>
  </g>

  <!-- Branching Arrows to 3 Detection Engines -->
  <path d="M 220 218 L 220 240" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#aDown)"/>
  <path d="M 480 218 L 480 240" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#aDown)"/>
  <path d="M 740 218 L 740 240" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#aDown)"/>

  <!-- Level 3: Tri-Engine Forensic Observation Layer -->
  <!-- 3A: ML -->
  <g transform="translate(40, 242)">
    <rect width="270" height="100" rx="10" fill="url(#engBox)" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="10" y="10" width="105" height="18" rx="3" fill="#0284c7" fill-opacity="0.2"/>
    <text x="62" y="23" fill="#38bdf8" font-size="9" font-weight="700" class="mono" text-anchor="middle">STATISTICAL ML</text>
    <text x="10" y="46" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Isolation Forest + Platt</text>
    <text x="10" y="66" fill="#94a3b8" font-size="10.5" class="sans">9 features · scikit-learn</text>
    <text x="10" y="84" fill="#cbd5e1" font-size="10" class="mono">Out: r_stat ∈ [0, 1]</text>
  </g>

  <!-- 3B: Graph -->
  <g transform="translate(345, 242)">
    <rect width="270" height="100" rx="10" fill="url(#engBox)" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="10" y="10" width="115" height="18" rx="3" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="67" y="23" fill="#c084fc" font-size="9" font-weight="700" class="mono" text-anchor="middle">NETWORK GRAPH</text>
    <text x="10" y="46" fill="#f8fafc" font-size="13" font-weight="700" class="sans">NetworkX MultiDiGraph</text>
    <text x="10" y="66" fill="#94a3b8" font-size="10.5" class="sans">Cycle detection · Louvain density</text>
    <text x="10" y="84" fill="#cbd5e1" font-size="10" class="mono">Out: r_graph ∈ [0, 1]</text>
  </g>

  <!-- 3C: Weather -->
  <g transform="translate(650, 242)">
    <rect width="270" height="100" rx="10" fill="url(#engBox)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="10" y="10" width="105" height="18" rx="3" fill="#10b981" fill-opacity="0.2"/>
    <text x="62" y="23" fill="#34d399" font-size="9" font-weight="700" class="mono" text-anchor="middle">PHYSICAL TRUTH</text>
    <text x="10" y="46" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Open-Meteo Satellite API</text>
    <text x="10" y="66" fill="#94a3b8" font-size="10.5" class="sans">Sun elevation · Irradiance ceiling</text>
    <text x="10" y="84" fill="#cbd5e1" font-size="10" class="mono">Out: r_phys ∈ [0, 1]</text>
  </g>

  <!-- Convergence lines to Risk Fusion & Explainability -->
  <path d="M 175 342 L 175 365 L 340 365" stroke="#38bdf8" stroke-width="1.2"/>
  <path d="M 480 342 L 480 365" stroke="#38bdf8" stroke-width="1.2"/>
  <path d="M 785 342 L 785 365 L 620 365" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Level 4: Risk Fusion & Explainability Core -->
  <g transform="translate(240, 360)">
    <rect width="480" height="52" rx="10" fill="url(#fusBox)" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="240" y="24" fill="#ffffff" font-size="12" font-weight="700" class="sans" text-anchor="middle">RISK FUSION &amp; EXPLAINABILITY ENGINE</text>
    <text x="240" y="42" fill="#fecdd3" font-size="11" class="mono" text-anchor="middle">Noisy-OR R = 1 - ∏(1 - r_i) · Claude LLM / Deterministic Fallback</text>
  </g>

  <!-- Dual output arrows: Left to Audit Ledger, Right to Blockchain -->
  <path d="M 360 412 L 360 436 L 220 436" stroke="#475569" stroke-width="1.5" marker-end="url(#aDown)"/>
  <path d="M 600 412 L 600 436 L 740 436" stroke="#10b981" stroke-width="1.5" marker-end="url(#aEmerald)"/>

  <!-- Level 5A: Off-chain Audit Ledger (Left) -->
  <g transform="translate(40, 440)">
    <rect width="360" height="64" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" fill="#f8fafc" font-size="12" font-weight="700" class="sans">SQLAlchemy Append-Only Audit Ledger</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5" class="sans">Cryptographic Hash Chain · SQLite / PostgreSQL</text>
    <text x="14" y="56" fill="#64748b" font-size="9.5" class="mono">Permanent history of every analysis event</text>
  </g>

  <!-- Level 5B: On-chain Verification (Right) -->
  <g transform="translate(560, 440)">
    <rect width="360" height="64" rx="8" fill="url(#chainGrad)" stroke="#059669" stroke-width="1.2"/>
    <text x="14" y="24" fill="#f8fafc" font-size="12" font-weight="700" class="sans">ERC-721 RECRegistry.sol (Hardhat / Sepolia)</text>
    <text x="14" y="42" fill="#a7f3d0" font-size="10.5" class="mono">keccak256(plant,mwh,ts) · Fraud Score · Retirement Lock</text>
    <text x="14" y="56" fill="#6ee7b7" font-size="9.5" class="sans">Public zero-auth on-chain verification at /verify</text>
  </g>
</svg>

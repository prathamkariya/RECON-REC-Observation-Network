<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <linearGradient id="physBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="sunCurve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Ground -->
  <rect width="860" height="300" rx="14" fill="url(#physBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="1" y="1" width="858" height="40" rx="13" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="26" cy="20" r="5" fill="#10b981"/>
  <text x="42" y="24" fill="#f8fafc" font-size="12" font-weight="700" class="sans" letter-spacing="0.5">PHYSICAL VALIDATION: DIURNAL SOLAR WINDOW &amp; WEATHER CROSS-CHECK</text>
  <rect x="710" y="9" width="134" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="777" y="24" fill="#6ee7b7" font-size="10" font-weight="700" class="mono" text-anchor="middle">OPEN-METEO API</text>

  <!-- Left: 24h Diurnal Solar Curve vs Night Claim -->
  <g transform="translate(30, 56)">
    <rect width="480" height="220" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Night Zones Shading (00:00 - 06:00 and 18:00 - 24:00) -->
    <rect x="50" y="20" width="95" height="160" fill="#1e1b4b" fill-opacity="0.35"/>
    <rect x="365" y="20" width="85" height="160" fill="#1e1b4b" fill-opacity="0.35"/>
    <text x="97" y="36" fill="#818cf8" font-size="9" class="mono" text-anchor="middle">NIGHT</text>
    <text x="407" y="36" fill="#818cf8" font-size="9" class="mono" text-anchor="middle">NIGHT</text>

    <!-- Day Daylight Window (06:00 - 18:00) -->
    <text x="250" y="36" fill="#f59e0b" font-size="9" font-weight="700" class="mono" text-anchor="middle">DAYLIGHT WINDOW (980 W/m² PEAK)</text>

    <!-- Axes -->
    <line x1="50" y1="20" x2="50" y2="180" stroke="#1e293b" stroke-width="1"/>
    <line x1="50" y1="180" x2="450" y2="180" stroke="#1e293b" stroke-width="1"/>

    <!-- Clear-sky Solar Irradiance Curve -->
    <path d="M 145 180 Q 250 40 365 180" fill="url(#sunCurve)" stroke="#f59e0b" stroke-width="2.5"/>
    
    <!-- Horizon line -->
    <line x1="50" y1="180" x2="450" y2="180" stroke="#475569" stroke-width="1"/>
    <text x="45" y="184" fill="#64748b" font-size="8.5" class="mono" text-anchor="end">0 W/m²</text>
    <text x="45" y="55" fill="#64748b" font-size="8.5" class="mono" text-anchor="end">1000 W</text>

    <!-- X-axis hours -->
    <text x="50" y="196" fill="#64748b" font-size="9" class="mono">00:00</text>
    <text x="95" y="196" fill="#ef4444" font-size="9" font-weight="700" class="mono">02:13</text>
    <text x="145" y="196" fill="#64748b" font-size="9" class="mono">06:00</text>
    <text x="250" y="196" fill="#64748b" font-size="9" class="mono">12:00</text>
    <text x="365" y="196" fill="#64748b" font-size="9" class="mono">18:00</text>
    <text x="440" y="196" fill="#64748b" font-size="9" class="mono">24:00</text>

    <!-- Fraud Claim Point at 02:13 IST -->
    <g transform="translate(95, 180)">
      <!-- Ghost Claim Column -->
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="0" cy="-100" r="7" fill="#ef4444"/>
      <circle cx="0" cy="-100" r="2.5" fill="#ffffff"/>
      
      <rect x="12" y="-120" width="130" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="20" y="-106" fill="#fca5a5" font-size="9" font-weight="700" class="mono">CLAIM: 4.20 MWh</text>
      <text x="20" y="-92" fill="#ffffff" font-size="8.5" class="mono">Irradiance: 0.0 W/m²</text>
    </g>
  </g>

  <!-- Right: Verification Card -->
  <g transform="translate(530, 56)">
    <rect width="300" height="220" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.2"/>
    
    <rect x="16" y="16" width="105" height="20" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="68" y="30" fill="#f87171" font-size="9.5" font-weight="700" class="mono" text-anchor="middle">PHYSICS VIOLATION</text>
    
    <text x="16" y="60" fill="#f8fafc" font-size="14" font-weight="700" class="sans">Physical Disqualification</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10.5" class="sans">Night Solar Claim Detection</text>
    
    <line x1="16" y1="88" x2="284" y2="88" stroke="#1e293b" stroke-width="1"/>

    <!-- Data lines -->
    <text x="16" y="108" fill="#94a3b8" font-size="10" class="mono">Plant ID:</text>
    <text x="284" y="108" fill="#f8fafc" font-size="10" font-weight="700" class="mono" text-anchor="end">SOLAR-PLANT-17</text>

    <text x="16" y="126" fill="#94a3b8" font-size="10" class="mono">Coordinates:</text>
    <text x="284" y="126" fill="#cbd5e1" font-size="10" class="mono" text-anchor="end">23.0225° N, 72.5714° E</text>

    <text x="16" y="144" fill="#94a3b8" font-size="10" class="mono">Solar Window:</text>
    <text x="284" y="144" fill="#ef4444" font-size="10" font-weight="700" class="mono" text-anchor="end">06:00–18:00 IST (Night Claim)</text>

    <text x="16" y="162" fill="#94a3b8" font-size="10" class="mono">Hourly Irradiance:</text>
    <text x="284" y="162" fill="#ef4444" font-size="10" font-weight="700" class="mono" text-anchor="end">0.0 W/m² (Pitch Dark)</text>

    <!-- Verdict -->
    <rect x="14" y="176" width="272" height="30" rx="6" fill="#ef4444"/>
    <text x="150" y="196" fill="#ffffff" font-size="11" font-weight="800" class="sans" text-anchor="middle">PHYSICAL MISMATCH · REJECTED</text>
  </g>
</svg>

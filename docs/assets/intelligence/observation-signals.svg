<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <linearGradient id="obsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="fuseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <rect width="880" height="280" rx="14" fill="url(#obsBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Bar -->
  <rect x="1" y="1" width="878" height="38" rx="13" fill="#0f172a" fill-opacity="0.9"/>
  <text x="440" y="24" fill="#f8fafc" font-size="12" font-weight="700" class="sans" text-anchor="middle" letter-spacing="1.5">THREE OBSERVATION SIGNALS · ONE FUSED RISK PROFILE</text>

  <!-- Signal 1: Statistical -->
  <g transform="translate(24, 54)">
    <rect width="260" height="200" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#172554" fill-opacity="0.6"/>
    <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
    <text x="34" y="22" fill="#93c5fd" font-size="11" font-weight="700" class="mono" letter-spacing="0.8">STATISTICAL</text>

    <text x="14" y="58" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Isolation Forest</text>
    <text x="14" y="76" fill="#94a3b8" font-size="10.5" class="sans">Unsupervised anomaly detection</text>
    <text x="14" y="92" fill="#94a3b8" font-size="10.5" class="sans">with Platt-scaled calibration</text>

    <line x1="14" y1="104" x2="246" y2="104" stroke="#1e293b" stroke-width="1"/>

    <text x="14" y="122" fill="#64748b" font-size="9" class="mono">9 ENGINEERED FEATURES:</text>
    <text x="14" y="140" fill="#cbd5e1" font-size="9.5" class="sans">capacity_utilization · issuance_velocity</text>
    <text x="14" y="154" fill="#cbd5e1" font-size="9.5" class="sans">buyer_concentration · serial_duplicate</text>
    <text x="14" y="168" fill="#cbd5e1" font-size="9.5" class="sans">benford_deviation · plant_zscore</text>
    <text x="14" y="182" fill="#cbd5e1" font-size="9.5" class="sans">min_gap_hours · transfer_velocity</text>

    <rect x="14" y="192" width="232" height="2" rx="1" fill="#38bdf8" fill-opacity="0.4"/>
  </g>

  <!-- Signal 2: Network -->
  <g transform="translate(310, 54)">
    <rect width="260" height="200" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#2e1065" fill-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#a78bfa"/>
    <text x="34" y="22" fill="#c4b5fd" font-size="11" font-weight="700" class="mono" letter-spacing="0.8">NETWORK</text>

    <text x="14" y="58" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Graph Topology Analysis</text>
    <text x="14" y="76" fill="#94a3b8" font-size="10.5" class="sans">NetworkX directed multigraph</text>
    <text x="14" y="92" fill="#94a3b8" font-size="10.5" class="sans">modeling certificate transfers</text>

    <line x1="14" y1="104" x2="246" y2="104" stroke="#1e293b" stroke-width="1"/>

    <text x="14" y="122" fill="#64748b" font-size="9" class="mono">DETECTS:</text>
    <text x="14" y="140" fill="#cbd5e1" font-size="10" class="sans">• Circular trading cycles</text>
    <text x="14" y="158" fill="#cbd5e1" font-size="10" class="sans">• Community density anomalies</text>
    <text x="14" y="176" fill="#cbd5e1" font-size="10" class="sans">• Self-dealing (issuer = buyer)</text>

    <rect x="14" y="192" width="232" height="2" rx="1" fill="#a78bfa" fill-opacity="0.4"/>
  </g>

  <!-- Signal 3: Physical -->
  <g transform="translate(596, 54)">
    <rect width="260" height="200" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#422006" fill-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#f59e0b"/>
    <text x="34" y="22" fill="#fcd34d" font-size="11" font-weight="700" class="mono" letter-spacing="0.8">PHYSICAL</text>

    <text x="14" y="58" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Weather Cross-Check</text>
    <text x="14" y="76" fill="#94a3b8" font-size="10.5" class="sans">Open-Meteo historical hourly</text>
    <text x="14" y="92" fill="#94a3b8" font-size="10.5" class="sans">weather data at plant coordinates</text>

    <line x1="14" y1="104" x2="246" y2="104" stroke="#1e293b" stroke-width="1"/>

    <text x="14" y="122" fill="#64748b" font-size="9" class="mono">CROSS-CHECKS:</text>
    <text x="14" y="140" fill="#cbd5e1" font-size="10" class="sans">• Solar timing vs day/night</text>
    <text x="14" y="158" fill="#cbd5e1" font-size="10" class="sans">• Claimed MWh vs rated capacity</text>
    <text x="14" y="176" fill="#cbd5e1" font-size="10" class="sans">• Shortwave radiation + cloud cover</text>

    <rect x="14" y="192" width="232" height="2" rx="1" fill="#f59e0b" fill-opacity="0.4"/>
  </g>
</svg>
